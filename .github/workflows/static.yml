# Export the Godot web build and publish it to GitHub Pages.
# The repository root is the game project and has no index.html, so Pages
# must receive the exported build/web folder.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --import --quit || true

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
